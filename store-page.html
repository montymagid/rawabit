<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة المتجر | روابط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<section class="section-tight">
  <div class="container">
    <div id="store-head" style="display:flex; align-items:center; gap:18px; margin-bottom:30px;">
      <div class="skeleton" style="width:70px;height:70px;border-radius:16px;"></div>
      <div><div class="skeleton" style="width:180px;height:22px;border-radius:6px;"></div></div>
    </div>
    <div class="grid-products" id="store-products">
      <div class="product-card skeleton" style="height:280px;"></div>
      <div class="product-card skeleton" style="height:280px;"></div>
      <div class="product-card skeleton" style="height:280px;"></div>
      <div class="product-card skeleton" style="height:280px;"></div>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const storeId = new URLSearchParams(location.search).get('store');
  if(!storeId) return;
  const { data: store } = await window.sb.from('stores').select('*').eq('id', storeId).eq('status','approved').maybeSingle();
  const headEl = document.getElementById('store-head');
  if(!store){
    headEl.innerHTML = `<div class="empty-state"><div class="em-icon">🏬</div><p>المتجر غير موجود أو غير متاح حاليًا.</p></div>`;
    document.getElementById('store-products').innerHTML = '';
    return;
  }
  headEl.innerHTML = `
    <img src="${store.logo_url || 'https://api.dicebear.com/7.x/initials/svg?seed='+encodeURIComponent(store.store_name)}" style="width:70px;height:70px;border-radius:16px;object-fit:cover;">
    <div>
      <h1 style="font-size:24px;">${escapeHtml(store.store_name)}</h1>
      <p style="color:var(--ink-soft); font-size:14px; margin-top:4px;">${escapeHtml(store.description || '')} ${store.city ? '· '+escapeHtml(store.city) : ''}</p>
    </div>`;

  const { data: products } = await window.sb.from('products').select('*').eq('store_id', storeId).eq('status','active').order('created_at',{ascending:false});
  const grid = document.getElementById('store-products');
  grid.innerHTML = (products && products.length) ? products.map(p => `
    <a class="product-card" href="${p.affiliate_link || '#'}" target="${p.affiliate_link ? '_blank' : '_self'}" rel="noopener sponsored">
      <div class="pc-img"><img src="${p.image_url || 'https://picsum.photos/seed/'+p.id+'/500/500'}" alt="${escapeHtml(p.name)}"></div>
      <div class="pc-body">
        <div class="pc-name">${escapeHtml(p.name)}</div>
        <div class="pc-price-row"><span class="pc-price num">${fmtPrice(p.price)} ر.س</span></div>
      </div>
    </a>`).join('') : `<div class="empty-state" style="grid-column:1/-1;"><div class="em-icon">📦</div><p>لا توجد منتجات معروضة من هذا المتجر حاليًا.</p></div>`;
});
</script>
</body>
</html>
