<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | روابط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<section class="section" style="padding-top:60px;">
  <div class="container" style="max-width:460px;">
    <div style="text-align:center; margin-bottom:26px;">
      <h1 style="font-size:26px;">تسجيل الدخول</h1>
      <p style="color:var(--ink-soft); margin-top:8px;">لأصحاب المتاجر ولإدارة المنصة</p>
    </div>

    <form id="login-form" class="form-card">
      <div class="alert alert-error" id="login-error"></div>
      <div class="form-row">
        <label>البريد الإلكتروني</label>
        <input type="email" id="l-email" required placeholder="you@example.com">
      </div>
      <div class="form-row">
        <label>كلمة المرور</label>
        <input type="password" id="l-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">دخول</button>
      <p class="hint" style="text-align:center; margin-top:14px;">ليس لديك متجر بعد؟ <a href="/store-register.html" style="color:var(--emerald-700); font-weight:700;">سجّل متجرك مجانًا</a></p>
    </form>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/login.js"></script>
</body>
</html>
